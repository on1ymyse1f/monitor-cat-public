name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Swift tools 6.0 requires Xcode 16+. macos-15 ships the supported Swift 6
    # toolchain; macos-14 currently defaults to Swift 5.10.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release products
        run: swift build -c release
