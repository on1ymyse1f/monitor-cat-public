name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements-build.txt

      - name: Install Windows build dependencies
        run: python -m pip install -r windows/requirements-build.txt

      - name: Run Windows unit tests
        run: python -m unittest discover -s windows/tests -v

      - name: Build onedir package and ZIP
        shell: pwsh
        run: ./windows/build_windows.ps1 -Python python -SkipInstall -SkipSelfTest

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "windows/dist/AIMonitor/AIMonitor.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "AIMonitor.exe --self-test failed with exit code $($process.ExitCode)."
          }

      - name: Construct every packaged UI page
        shell: pwsh
        run: |
          $exe = (Resolve-Path "windows/dist/AIMonitor/AIMonitor.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList @("--ui-smoke") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "AIMonitor.exe --ui-smoke failed with exit code $($process.ExitCode)."
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AIMonitor-Windows-x64
          path: windows/dist/AIMonitor-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
